<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="R4D: браузерный PoC скелетной 2D-анимации" />
    <link rel="icon" href="data:," />
    <title>R4D — Skeletal Animation PoC</title>
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-label="Демонстрация персонажа"></div>
      <aside id="diagnostics">
        <div class="eyebrow">R4D · GPT-5.6 Sol</div>
        <div id="state">Загрузка…</div>
        <div id="phase"></div>
        <div id="blend"></div>
        <div class="controls">
          <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> движение</span>
          <span><kbd>Space</kbd> прыжок</span>
          <span><kbd>P</kbd> пауза · <kbd>B</kbd> кости</span>
          <span><kbd>T</kbd> автопереходы · <kbd>R</kbd> сброс</span>
        </div>
      </aside>
      <div id="error" role="alert" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
