<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="data:," />
    <title>Q3C — Пробуждение механизма</title>
  </head>
  <body>
    <main class="scene-shell">
      <header>
        <div><span class="eyebrow">R4D · Q3C</span><h1>Пробуждение механизма</h1></div>
        <div class="controls">
          <button id="unfold" type="button" aria-keyshortcuts="E" hidden>Раскрыться</button>
          <button id="hunt" type="button" aria-keyshortcuts="H Space" hidden>Схватить</button>
          <button id="repeat" type="button" aria-keyshortcuts="R" hidden>Ещё мотылёк</button>
          <button id="restart" type="button">Заново</button>
        </div>
      </header>
      <section id="stage" tabindex="0" aria-label="Интерактивная сцена: активируйте маячок любым действием">
        <p id="hint">Коснитесь сцены или нажмите любую клавишу</p>
        <p class="construction">Q3C · рабочая сцена</p>
        <div id="walk-controls" role="group" aria-label="Ходьба капсулы" hidden>
          <button type="button" data-step="-1" aria-keyshortcuts="ArrowLeft">← Влево</button>
          <button type="button" data-step="1" aria-keyshortcuts="ArrowRight">Вправо →</button>
        </div>
      </section>
      <footer><span id="status" role="status">Маячок ожидает сигнала</span><span class="edition">Этюд 03 / Охота</span></footer>
      <p id="error" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
