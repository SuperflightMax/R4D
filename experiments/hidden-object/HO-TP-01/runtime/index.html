<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HO-TP-01 · локальный просмотр</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="assets.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <div><h1>HO-TP-01</h1><p>Принятый C2 · хлеб и миска с тестом</p></div>
    <nav aria-label="Просмотр и управление">
      <button id="compare" type="button" disabled aria-pressed="false">Показать исходник</button>
      <button id="zoom" type="button" disabled aria-pressed="false">Исходные пиксели 1:1</button>
      <button id="reset" type="button" disabled>Сбросить прогон</button>
    </nav>
  </header>
  <p id="status" role="status">Загрузка точного исходника…</p>
  <main id="frames" aria-label="Рабочий кадр с переключением исходника">
    <figure>
      <figcaption id="work-caption">Рабочий кадр</figcaption>
      <canvas id="scene" width="1672" height="941" aria-label="Подберите хлеб и миску кликом по их видимым контурам"></canvas>
    </figure>
  </main>
  <footer>
    <p>Хлеб — две крупные соприкасающиеся половины. Отдельный отломок справа и россыпь остаются на столе. Миска включает тесто.</p>
    <p id="detail">Технический кандидат: у миски остаётся шов на стыке со льном. Художественная приёмка ещё впереди.</p>
  </footer>
</body>
</html>
